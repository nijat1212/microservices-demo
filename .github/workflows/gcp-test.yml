name: DevOps Practice (Terraform & Docker Build)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  terraform:
    name: "Infrastructure Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./my-infra
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init & Plan
      run: |
        terraform init
        terraform plan

  docker-build:
    name: "CI: Build Docker Image"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Product Catalog Service
      uses: docker/build-push-action@v6
      with:
        context: ./src/productcatalogservice
        push: false # Пока просто тестируем сборку, никуда не отправляем
        tags: productcatalogservice:test

  auto-stop-vm:
    name: "Cost Optimization: Stop VM"
    runs-on: ubuntu-latest
    needs: [terraform, docker-build] # Запустится только ПОСЛЕ того, как пройдут первые два шага
    if: always() # Сработает ВСЕГДА, даже если сборка Docker или Terraform упадут с ошибкой
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 💤 Safe Stop VM
      run: |
        gcloud compute instances stop linuxaome123-new --zone=europe-west3-a

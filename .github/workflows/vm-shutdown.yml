name: 💤 Manual Cost Control (Stop VM)

on:
  workflow_dispatch: # Это включает ручной запуск кнопкой на сайте

jobs:
  stop-server:
    runs-on: ubuntu-latest
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 🛑 Shut down Compute Engine
      run: |
        gcloud compute instances stop linuxaome123-new --zone=europe-west3-a
